<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restricted Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0b0c10;
            --surface: #13151a;
            --border: #1f2330;
            --border-active: #3a8eff;
            --accent: #3a8eff;
            --accent-glow: rgba(58, 142, 255, 0.25);
            --text: #e2e6f0;
            --muted: #4a5068;
            --error: #ff4f6d;
            --error-glow: rgba(255, 79, 109, 0.2);
            --mono: 'DM Mono', monospace;
            --display: 'Syne', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--display);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.4;
            z-index: 0;
        }

        /* Radial glow center */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(ellipse, rgba(58, 142, 255, 0.08) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 380px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px 40px;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 24px 64px rgba(0,0,0,0.6),
                0 0 80px rgba(58, 142, 255, 0.04);
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Lock icon */
        .icon-wrap {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #1a2540, #1f2d50);
            border: 1px solid #253050;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            box-shadow: 0 4px 16px rgba(58, 142, 255, 0.15);
        }

        .icon-wrap svg {
            width: 24px;
            height: 24px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .label-tag {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.18em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .subtitle {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 36px;
            line-height: 1.6;
        }

        .field-label {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.1em;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 10px;
            display: block;
        }

        .input-wrap {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="password"] {
            width: 100%;
            padding: 13px 46px 13px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            letter-spacing: 0.12em;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            caret-color: var(--accent);
        }

        input[type="password"]::placeholder {
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        input[type="password"]:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input.error-state {
            border-color: var(--error) !important;
            box-shadow: 0 0 0 3px var(--error-glow) !important;
            animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }

        /* Eye toggle */
        .toggle-eye {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--muted);
            transition: color 0.2s;
            background: none;
            border: none;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .toggle-eye:hover { color: var(--text); }
        .toggle-eye svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        button#submitBtn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            font-family: var(--display);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(58, 142, 255, 0.3);
        }

        button#submitBtn:hover {
            opacity: 0.92;
            box-shadow: 0 6px 28px rgba(58, 142, 255, 0.45);
        }

        button#submitBtn:active {
            transform: scale(0.98);
        }

        button#submitBtn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
        }
        @keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }
        button#submitBtn.loading .spinner { display: block; }

        .error-msg {
            display: none;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 11px 14px;
            background: rgba(255, 79, 109, 0.08);
            border: 1px solid rgba(255, 79, 109, 0.25);
            border-radius: 8px;
            font-family: var(--mono);
            font-size: 12px;
            color: var(--error);
        }

        .error-msg.visible { display: flex; }

        .error-msg svg {
            width: 14px;
            height: 14px;
            stroke: var(--error);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            flex-shrink: 0;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 32px 0 20px;
        }

        .footer-note {
            font-family: var(--mono);
            font-size: 10.5px;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>

        <p class="label-tag">Restricted Area</p>
        <h1>Internal Access</h1>
        <p class="subtitle">Enter your credentials to continue.</p>

        <label class="field-label" for="password">Access Key</label>
        <div class="input-wrap">
            <input type="password" id="password" placeholder="••••••••••••" autocomplete="current-password">
            <button class="toggle-eye" id="eyeBtn" type="button" aria-label="Toggle visibility" onclick="toggleEye()">
                <svg id="eyeIcon" viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>

        <button id="submitBtn" onclick="checkAccess()">
            Verify Access
            <div class="spinner"></div>
        </button>

        <div class="error-msg" id="error">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Access denied — incorrect key.
        </div>
    </div>

    <script>
        // ── Security config ─────────────────────────────────────────────
        const targetHash  = "a21c1bed615b0224e8f1d418b4bd4b8a29a60dbc49f60952a540108c03c6eb2b";
        const encryptedUrl = [141, 116, 116, 128, 4, 117, 106, 80, 133, 157];
        // ────────────────────────────────────────────────────────────────

        function toggleEye() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('eyeIcon');
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.innerHTML = isHidden
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        }

        async function checkAccess() {
            const passInput = document.getElementById('password');
            const btn       = document.getElementById('submitBtn');
            const errorEl   = document.getElementById('error');

            const pass = passInput.value;
            if (!pass) return;

            // Loading state
            btn.classList.add('loading');
            btn.querySelector('.spinner').style.display = 'block';
            errorEl.classList.remove('visible');
            passInput.classList.remove('error-state');

            const encoder    = new TextEncoder();
            const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(pass));
            const hashArray  = new Uint8Array(hashBuffer);
            const inputHash  = Array.from(hashArray).map(b => b.toString(16).padStart(2, '0')).join('');

            btn.classList.remove('loading');

            if (inputHash === targetHash) {
                let decryptedUrl = "";
                for (let i = 0; i < encryptedUrl.length; i++) {
                    decryptedUrl += String.fromCharCode(encryptedUrl[i] ^ hashArray[i % hashArray.length]);
                }
                window.location.href = decryptedUrl;
            } else {
                passInput.classList.add('error-state');
                errorEl.classList.add('visible');
                passInput.value = '';
                passInput.focus();
            }
        }

        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') checkAccess();
            document.getElementById('password').classList.remove('error-state');
        });
    </script>
</body>
</html>
